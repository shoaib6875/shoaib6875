<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Shoaib Akhtar — Java Backend Developer</title>
  <desc id="desc">A dark, modern code-themed banner with blue and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080e1c"/>
      <stop offset="52%" stop-color="#111b35"/>
      <stop offset="100%" stop-color="#21143e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#53d8fb"/>
      <stop offset="50%" stop-color="#7c8cff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="55" r="135" fill="#7c3aed" opacity=".10"/>
  <circle cx="1010" cy="260" r="170" fill="#38bdf8" opacity=".08"/>
  <path d="M0 255 C250 210 410 320 700 245 S1030 170 1200 215" stroke="url(#accent)" stroke-width="2" stroke-opacity=".28" fill="none"/>
  <path d="M820 0 L700 300 M940 0 L820 300 M1060 0 L940 300" stroke="#a5b4fc" stroke-opacity=".08" stroke-width="2"/>
  <g transform="translate(78 65)">
    <rect x="0" y="0" width="8" height="155" rx="4" fill="url(#accent)" filter="url(#glow)"/>
    <text x="35" y="32" fill="#93c5fd" font-family="Consolas, 'Courier New', monospace" font-size="18">&lt;hello world /&gt;</text>
    <text x="32" y="91" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="1.3">SHOAIB AKHTAR</text>
    <rect x="35" y="111" width="470" height="2" rx="1" fill="url(#accent)"/>
    <text x="35" y="143" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="23">Java Backend Developer  •  AWS &amp; DevOps</text>
    <text x="35" y="176" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif" font-size="16">Build reliable systems. Automate wisely. Keep learning.</text>
  </g>
  <g transform="translate(915 83)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M55 15 L15 55 L55 95"/>
    <path d="M112 15 L152 55 L112 95"/>
    <path d="M95 2 L72 108"/>
  </g>
  <g fill="#c4b5fd" opacity=".75"><circle cx="1120" cy="45" r="3"/><circle cx="1150" cy="80" r="2"/><circle cx="850" cy="240" r="3"/><circle cx="890" cy="220" r="2"/><circle cx="1090" cy="245" r="2"/></g>
</svg>
